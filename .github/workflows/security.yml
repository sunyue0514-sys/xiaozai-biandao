name: Source and dependency checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/scan-public-source.cjs
      - run: pnpm audit --audit-level high
      - run: pnpm test
      - run: pnpm ts-check
      - run: pnpm lint:build
      - run: pnpm build
